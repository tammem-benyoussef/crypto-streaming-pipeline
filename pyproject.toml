[project]
name = "crypto-streaming-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "pandas<3",
    "pre-commit>=4.7.0",
    "pyspark==4.2.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["spark: tests that need Java and pyspark"]

[tool.ruff]
line-length = 100
