[project]
name = "crypto-streaming-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.16.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
